# nginx: публикация 1610 на нестандартном порту HTTPS 8444.
# 1210 продолжает работать на 8443; после приёмки можно переключить 8443
# на 127.0.0.1:8001, заменив proxy_pass в основном конфиге.
#
# Установка:
#   sudo cp deploy/nginx-rtk1610.conf /etc/nginx/sites-available/rtk1610
#   sudo ln -s /etc/nginx/sites-available/rtk1610 /etc/nginx/sites-enabled/rtk1610
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат — общий с 1210 (/etc/ssl/rtk/rtk.crt).

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/rtk/rtk.crt;
    ssl_certificate_key /etc/ssl/rtk/rtk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    # Долгие ответы CPU-модели и RAG-индексация.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг ответа (SSE) без буферизации.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    location /internal/ { return 404; }
}
