# nginx: публикация веб-чата на НЕСТАНДАРТНОМ порту HTTPS (8443).
# См. docs/vps-llm-service.md §8.1.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rtk
#   sudo ln -s /etc/nginx/sites-available/rtk /etc/nginx/sites-enabled/rtk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ПОЧЕМУ 8443, а не 443: страховка от массового сканирования «типовых»
# портов (80/443). Публичный адрес: https://91.188.213.252:8443/
# ВАЖНО: это лишь снижение шума, НЕ полноценная защита — для реальной
# защиты нужен фаервол (ufw) + rate-limit (rate-limit уже в приложении).
# Порт 80 намеренно НЕ слушаем: не светимся по HTTP и не держим редирект.
#
# HTTPS (самоподписанный сертификат, т.к. домена нет — доступ по IP):
#   Создать сертификат с SAN = публичный IP (см. deploy/setup-https.sh):
#     sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#       -keyout /etc/ssl/rtk/rtk.key -out /etc/ssl/rtk/rtk.crt \
#       -subj "/CN=91.188.213.252" \
#       -addext "subjectAltName=IP:91.188.213.252"
#   Браузер один раз покажет предупреждение (самоподписанный сертификат) —
#   это ожидаемо; трафик после принятия шифруется (TLS).
#
# Публичный порт задаётся здесь (listen). App слушает 127.0.0.1:8000.

# --- HTTPS (8443): основной сервис на НЕСТАНДАРТНОМ порту ---
server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    # Самоподписанный сертификат (домена нет, доступ по IP 91.188.213.252).
    ssl_certificate     /etc/ssl/rtk/rtk.crt;
    ssl_certificate_key /etc/ssl/rtk/rtk.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Размер тела запроса: вопрос + история + настройки (см. §7.3).
    client_max_body_size 1m;

    # Долгие ответы медленной CPU-модели (см. §5.6, §8.3).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Прокидываем реальный IP клиента (для rate limit, см. §7.4).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг ответа (SSE) без буферизации (см. §8.3).
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        add_header X-Accel-Buffering no;
    }

    # Доступ к внутренним портам движка/app извне закрыт (см. §9).
    location /internal/ { return 404; }
}

